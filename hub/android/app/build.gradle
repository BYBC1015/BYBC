plugins {
    id "com.android.application"
}

android {
    namespace "xyz.baicang.codexhub"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "xyz.baicang.codexhub"
        minSdk 23
        targetSdk 35
        versionCode 29
        versionName "0.2.0"

        buildConfigField "String", "HUB_URL", "\"https://203.0.113.10/hub/\""
    }
    // Private distribution keeps the installed certificate while production code
    // uses DEBUG=false and cannot enable emulator-only fixture endpoints.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
