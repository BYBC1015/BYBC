server {
    listen 80;
    server_name hub.example.invalid;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Preserve an existing mount prefix, including login/static/download URLs.
    location = /hub {
        return 308 https://203.0.113.10/hub/$is_args$args;
    }

    location ^~ /hub/ {
        return 308 https://203.0.113.10$request_uri;
    }

    location / {
        return 308 https://203.0.113.10/hub$request_uri;
    }
}
